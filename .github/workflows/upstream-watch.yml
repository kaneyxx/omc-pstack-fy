name: upstream-watch

# Daily, and on every push to main that changes upstream.json, compare the pinned pstack and oh-my-claudecode with their newest
# versions. When either has newer vendored files, try the sync in a scratch copy and open or update one issue with the report and
# a verdict. When both match, close that issue, so a sync closes it without a manual run.
# Only kaneyxx/omc-pstack-fy runs it, because a fork has issues off, so the run would fail and mail the fork's owner.
# The logic lives in tools/watch.mjs, so `node tools/watch.mjs` shows the same report locally.
on:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths: [upstream.json]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch

jobs:
  watch:
    if: github.repository == 'kaneyxx/omc-pstack-fy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report the upstream update as an issue
        # Exit 3 means an upstream is newer, and the issue already says so. Any other failure, a failed gh call included, fails the step.
        run: node tools/watch.mjs --issue || [ $? -eq 3 ]
